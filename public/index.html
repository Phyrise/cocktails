<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="__BASE__/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="__BASE__/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="__BASE__/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cocktails" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F4EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141011" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #f8f4ee;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #141011;
        }
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      input,
      textarea {
        font-size: 16px;
      }
    </style>
    <script>
      // Le service worker (cache hors ligne) n'est installé que dans le site publié.
      if ('serviceWorker' in navigator && '__BASE__'.indexOf('__') !== 0) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('__BASE__/sw.js', { scope: '__BASE__/' }).catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>Activez JavaScript pour utiliser Arturo et Clémentine.</noscript>
    <div id="root"></div>
  </body>
</html>
